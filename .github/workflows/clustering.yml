name: Vara clustering tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/**"
      - "chatgpt/**"

jobs:
  clustering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests
